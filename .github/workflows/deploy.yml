name: Azure Cloud Deployment

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: '{"clientId": "${{ secrets.APPID }}", "clientSecret": "${{ secrets.PASSWORD }}", "subscriptionId": "${{ secrets.SUBSCRIPTION_ID }}", "tenantId": "${{ secrets.TENANT }}"}'

    - name: Run Azure CLI commands / Deployment
      run: |
        echo "Successfully authenticated to Azure with zero-cost CI/CD pipeline!"
        az account show
