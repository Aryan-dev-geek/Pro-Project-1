resources:
  jobs:
    coingecko_pipeline_job:
      name: "CoinGecko-Incremental-Pipeline"
      
      # Runs automatically every 15 minutes
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: "UTC"

      tasks:
        - task_key: bronze_ingest
          environment_key: serverless_env
          spark_python_task:
            python_file: "../src/bronze/ingest_coingecko.py"

        - task_key: silver_clean
          depends_on:
            - task_key: bronze_ingest
          environment_key: serverless_env
          spark_python_task:
            python_file: "../src/silver/clean_crypto.py"

        - task_key: gold_aggregate
          depends_on:
            - task_key: silver_clean
          environment_key: serverless_env
          spark_python_task:
            python_file: "../src/gold/aggregate_crypto.py"

      # Define serverless environment profile
      environments:
        - environment_key: serverless_env
          spec:
            client: "default"
