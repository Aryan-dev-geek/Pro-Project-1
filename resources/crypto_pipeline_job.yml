resources:
  jobs:
    crypto_pipeline:
      name: "crypto-medallion-pipeline"
      schedule:
        quartz_cron_expression: "0 0/5 * * * ?"
        timezone_id: "UTC"
      tasks:
        - task_key: bronze_ingest
          # Removing existing_cluster_id and adding environment_key routes this task to Serverless Compute
          environment_key: default
          spark_python_task:
            python_file: "../src/bronze/ingest_coingecko.py"
          
        - task_key: silver_clean
          depends_on:
            - task_key: bronze_ingest
          environment_key: default
          spark_python_task:
            python_file: "../src/silver/clean_crypto.py"

        - task_key: gold_aggregate
          depends_on:
            - task_key: silver_clean
          environment_key: default
          spark_python_task:
            python_file: "../src/gold/aggregate_crypto.py"

      environments:
        - environment_key: default
          spec:
            client: "default"
