resources:
  jobs:
    pro_project_job:
      name: "Pro-Project-Data-Pipeline"
      job_clusters:
        - job_cluster_key: "jcluster"
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "Standard_F4s_v2"
            num_workers: 1
      tasks:
        - task_key: sample_task
          job_cluster_key: "jcluster"
          spark_python_task:
            python_file: "../src/main.py"
